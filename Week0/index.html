<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Zerodha: Online Brokerage Platform for Stock Trading & Investing
    </title>
  </head>
  <body>
    <div
      style="
        display: flex;
        justify-content: space-between;
        padding-left: 200px;
        padding-right: 200px;
        box-shadow: 2px 1px 2px #eee;
      "
    >
      <img
        src="zerodha.svg"
        alt="Zerodha Logo"
        width="120px"
        height="20px"
        style="padding-top: 20px"
      />
      <div style="display: flex">
        <div style="padding: 20px; color: #666; cursor: pointer">Signup</div>
        <div style="padding: 20px; color: #666; cursor: pointer">About</div>
        <div style="padding: 20px; color: #666; cursor: pointer">Products</div>
        <div style="padding: 20px; color: #666; cursor: pointer">Pricing</div>
        <div style="padding: 20px; color: #666; cursor: pointer">Support</div>
      </div>
      <br />
    </div>
    <div style="display: flex; justify-content: center; padding-top: 40px">
      <img src="landing.png" alt="Landing Image" width="80%" />
    </div>
    <div style="display: flex; justify-content: center; padding-top: 20px">
      <h1 style="font-weight: 500; font-size: 40; font-size: 2.75rem">
        Invest in everything
      </h1>
    </div>
    <div style="display: flex; justify-content: center; padding-top: 2px">
      <h2 style="font-weight: 500">
        Online platform to invest in stocks, derivatives, mutual funds, ETFs,
        bonds, and more.
      </h2>
    </div>
    <div style="display: flex; justify-content: center">
      <div style="background-color: #387ed1; padding: 10px 10px 10px 10px">
        Sign up for free
      </div>
    </div>
  </body>
</html>
